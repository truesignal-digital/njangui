name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Run checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        check: [typecheck, lint-design, test]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6 # keep in sync with packageManager in package.json

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - name: typecheck
        if: matrix.check == 'typecheck'
        run: bun run typecheck

      - name: lint-design
        if: matrix.check == 'lint-design'
        run: bun run lint:design

      - name: test
        if: matrix.check == 'test'
        # `bun run test`, not `bun test` — bare `bun test` bypasses the script
        # and globs the whole repo instead of the scoped convex/lib suite.
        run: bun run test

  # Single stable required check for branch protection — name stays "CI"
  # no matter how the matrix above changes shape.
  ci-ok:
    name: CI
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [checks]
    if: always()
    steps:
      - name: Assert all checks succeeded
        env:
          RESULT: ${{ needs.checks.result }}
        # Deliberately `= "success"`, never `!= "failure"` —
        # needs.<job>.result can also be 'skipped' or 'cancelled'.
        run: test "$RESULT" = "success"
