name: Deploy Convex

# develop = staging, main = production (docs/adr/0001-develop-is-staging.md).
# Feature PRs merge into develop and deploy staging; a release PR develop → main
# deploys the same backend code to prod.
on:
  push:
    branches: [develop, main]
    # package.json/bun.lock/convex.json included: the deployed bundle carries
    # node_modules deps (svix, convex itself) — a dep bump must deploy too,
    # not ride silently on the next unrelated convex/ edit.
    paths:
      - 'convex/**'
      - 'package.json'
      - 'bun.lock'
      - 'convex.json'

permissions:
  contents: read

concurrency:
  group: convex-deploy-${{ github.ref_name }}
  cancel-in-progress: false # never cancel a half-finished backend deploy

# Two jobs, each naming only its own secret. No branch ternaries and no GitHub
# Environments: an environment secret that is missing silently falls back to a
# repo secret of the same name, which once meant develop could deploy to prod.
jobs:
  deploy-staging:
    if: github.ref_name == 'develop' && vars.CONVEX_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      # Gate the deploy on the money-math suite and typecheck at the MERGED
      # commit; `convex deploy` only typechecks functions, it never runs tests.
      - run: bun run test
      - run: bun run typecheck

      # The key must belong to the staging deployment, never to prod.
      - name: Check the key targets staging
        run: |
          test -n "$CONVEX_DEPLOY_KEY" || { echo "CONVEX_STAGING_DEPLOY_KEY is missing"; exit 1; }
          case "$CONVEX_DEPLOY_KEY" in *benevolent-gopher-102*) ;; *) echo "Key does not target staging (benevolent-gopher-102)"; exit 1;; esac
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_STAGING_DEPLOY_KEY }}

      - run: bunx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_STAGING_DEPLOY_KEY }}

  deploy-prod:
    if: github.ref_name == 'main' && vars.CONVEX_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.6

      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - run: bun install --frozen-lockfile

      - run: bun run test
      - run: bun run typecheck

      # The prod key must exist and must not be the staging key.
      - name: Check the key targets production
        run: |
          test -n "$CONVEX_DEPLOY_KEY" || { echo "CONVEX_DEPLOY_KEY is missing"; exit 1; }
          case "$CONVEX_DEPLOY_KEY" in *benevolent-gopher-102*) echo "Prod job got the staging key"; exit 1;; esac
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}

      - run: bunx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
